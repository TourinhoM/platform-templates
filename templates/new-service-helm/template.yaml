apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-service-helm
  title: Microsserviço (Helm)
  description: Serviço HTTP que consome um arquétipo Helm central POR VERSÃO (oci://ghcr.io/tourinhom/charts). Cria dois repos — código (Fastify + CI que builda a imagem) e deploy (consumer chart fino + Argo Application + Renovate pra bumpar o arquétipo).
  tags:
    - helm
    - service
    - kubernetes
spec:
  owner: group:default/platform-engineering
  type: service

  # Identidade reusa o snippet compartilhado (name/description/system). O
  # arquétipo é a ÚNICA pergunta a mais — é escolha de identidade (que tipo de
  # workload), não um knob de runtime, então passa no teste "alguém faz isso
  # toda vez?". Os values do app nascem mínimos; o resto vem do arquétipo@versão.
  parameters:
    - $yaml: ../_shared/params-service.yaml
    - title: Arquétipo
      required: [archetype]
      properties:
        archetype:
          title: Arquétipo
          type: string
          description: Qual chart central este app consome. Define a forma do workload.
          default: backend
          enum:
            - backend
            - frontend
            - batch
          enumNames:
            - Backend — Deployment HTTP (Service + probes)
            - Frontend — nginx (configmap próprio)
            - Batch — CronJob (sem Service/probe)

  # Padrão de dois repos (igual ao new-service-full): código em ./code e deploy
  # em ./gitops; cada step-publish-* sobe só o seu sourcePath.
  #  - CÓDIGO (tourinho-labs/<nome>): esqueleto Fastify + CI que builda e publica
  #    ghcr.io/tourinho-labs/<nome> (mesmo skeleton/CI do new-service-full).
  #  - DEPLOY (gitops-<nome>): consumer chart fino — Argo autodetecta Chart.yaml
  #    -> Helm, puxa o arquétipo do OCI por versão e renderiza, com a image
  #    apontando pro que o CI do repo de código publica. Renovate bumpa o
  #    arquétipo (pin-por-versão, sem copiar o chart).
  steps:
    - id: fetch-code
      name: Montar esqueleto do serviço
      action: fetch:template
      input:
        url: ../new-service/skeleton
        targetPath: code
        # Workflows usam ${{ }} do GitHub Actions, que colide com o template do
        # scaffolder — copia verbatim pra não esvaziar secrets/vars/github.
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ user.ref }}
          system: ${{ parameters.system | parseEntityRef | pick('name') }}
          # Mantém as anotações de deploy (kubernetes-id, argocd) no catalog-info
          # do serviço — é o que o auto-discovery registra no catálogo.
          includeK8s: true

    # Overlay no repo de código (reusa todo o resto do skeleton compartilhado):
    #  - tools/microsservico/{values.yaml,values/<env>.yaml}: o CONTRATO que o dev
    #    edita (values-layering nativo, aninhado sob a chave do arquétipo). Único
    #    lugar de deploy que o dev toca — ele não tem acesso ao gitops.
    #  - .github/workflows/ci-tag.yml: caller no ci-tag-helm (build+push; a
    #    promoção de image é do Kargo, não mais do CI).
    #  - .github/workflows/config-sync.yml: on push em tools/microsservico/**,
    #    copia os values pro gitops (via token do App). Workflows =
    #    copyWithoutTemplating; os values são templados (usam system/archetype).
    - id: fetch-code-overlay
      name: Overlay do código (contrato tools/ + callers Helm)
      action: fetch:template
      input:
        url: ./skeleton-code
        targetPath: code
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}
          system: ${{ parameters.system | parseEntityRef | pick('name') }}
          archetype: ${{ parameters.archetype }}

    - id: fetch-gitops
      name: Montar consumer chart (deploy)
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: gitops
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ user.ref }}
          system: ${{ parameters.system | parseEntityRef | pick('name') }}
          archetype: ${{ parameters.archetype }}

    - $yaml: ../_shared/step-publish-code.yaml
    - $yaml: ../_shared/step-publish-gitops.yaml

    # Sem catalog:register: auto-discovery (GithubEntityProvider varre
    # tourinho-labs) é o dono do registro — register explícito dava 409 em
    # re-scaffold. A app aparece no catálogo no próximo scan (via catalog-info
    # do repo de código).

  # Dois repos (código + deploy) — reusa o output compartilhado de dois repos.
  output:
    $yaml: ../_shared/output-gitops.yaml
