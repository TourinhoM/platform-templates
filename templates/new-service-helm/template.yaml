apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-service-helm
  title: Microsserviço (Helm)
  description: Serviço HTTP que consome um arquétipo Helm central POR VERSÃO (oci://ghcr.io/tourinhom/charts). Cria dois repos — código (Fastify + CI que builda a imagem) e deploy (consumer chart fino + Argo Application + Renovate pra bumpar o arquétipo).
  tags:
    - helm
    - service
    - kubernetes
spec:
  owner: group:default/platform-engineering
  type: service

  # Identidade reusa o snippet compartilhado; o arquétipo é a única pergunta a mais.
  parameters:
    - $yaml: ../_shared/params-service.yaml
    - title: Arquétipo & stack
      required: [archetype, stack]
      properties:
        archetype:
          title: Arquétipo
          type: string
          description: Qual chart central este app consome. Define a forma do workload.
          default: backend
          enum:
            - backend
            - frontend
            - batch
          enumNames:
            - Backend — Deployment HTTP (Service + probes)
            - Frontend — nginx (configmap próprio)
            - Batch — CronJob (sem Service/probe)
        stack:
          title: Stack
          type: string
          description: Linguagem/runtime do serviço. Define o skeleton de código e a convenção de health.
          default: js
          enum:
            - js
            - java
          enumNames:
            - JavaScript — Fastify (health em /health)
            - Java — Spring Boot (health em /actuator/health)

  # Padrão de dois repos: código em ./code, deploy em ./gitops.
  steps:
    - id: fetch-code
      name: Montar esqueleto do serviço
      action: fetch:template
      input:
        # js: skeleton Fastify atual. java: skeleton Spring (a criar em new-service-spring).
        url: ${{ '../new-service/skeleton' if parameters.stack == 'js' else '../new-service-spring/skeleton' }}
        targetPath: code
        # Workflows têm ${{ }} de Actions: copia verbatim.
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ user.ref }}
          system: ${{ parameters.system | parseEntityRef | pick('name') }}
          # Mantém as anotações de deploy no catalog-info.
          includeK8s: true

    # Overlay no repo de código: contrato tools/ + callers de CI Helm.
    - id: fetch-code-overlay
      name: Overlay do código (contrato tools/ + callers Helm)
      action: fetch:template
      input:
        url: ./skeleton-code
        targetPath: code
        replace: true
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}
          system: ${{ parameters.system | parseEntityRef | pick('name') }}
          archetype: ${{ parameters.archetype }}
          stack: ${{ parameters.stack }}

    - id: fetch-gitops
      name: Montar consumer chart (deploy)
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: gitops
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ user.ref }}
          system: ${{ parameters.system | parseEntityRef | pick('name') }}
          archetype: ${{ parameters.archetype }}

    - $yaml: ../_shared/step-publish-code.yaml
    - $yaml: ../_shared/step-publish-gitops.yaml

    # Sem catalog:register: o auto-discovery é o dono do registro.

  # Dois repos (código + deploy) — reusa o output compartilhado de dois repos.
  output:
    $yaml: ../_shared/output-gitops.yaml
