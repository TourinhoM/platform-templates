# Credencial que o Kargo usa pra dar push no gitops-<app> (o git-push do
# promote-helm). Label kargo.akuity.io/cred-type=git + repoURL fazem o Kargo casar
# a credencial com o repo. Nasce do Vault via ESO (mesma cadeia do resto do lab);
# reusa o RELEASE_APP (mesmo App do config-sync/CI) — zero credencial nova.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitops-${{ values.name }}-repo
  namespace: ${{ values.name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: gitops-${{ values.name }}-repo
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: https://github.com/tourinho-labs/gitops-${{ values.name }}.git
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef: { key: cluster/kargo/${{ values.name }}, property: git_username }
    - secretKey: token
      remoteRef: { key: cluster/kargo/${{ values.name }}, property: git_token }
