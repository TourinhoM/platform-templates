# Credencial de git do Kargo (git-push do promote-helm). Reusa o PAT do Backstage
# (cluster/backstage/github_token): PAT de longa vida (não expira como token de App,
# e o Kargo é controller de longa duração) e já com write no tourinho-labs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitops-${{ values.name }}-repo
  namespace: ${{ values.name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: gitops-${{ values.name }}-repo
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: https://github.com/tourinho-labs/gitops-${{ values.name }}.git
        username: kargo                 # GitHub ignora o user quando a senha é PAT válido
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: cluster/backstage
        property: github_token
