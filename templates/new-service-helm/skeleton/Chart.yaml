apiVersion: v2
name: ${{ values.name }}
description: ${{ values.description }}
type: application
version: 0.1.0
appVersion: "0.1.0"
# Consome o arquétipo central POR VERSÃO — não copia o chart. Bump da versão
# abaixo = Renovate (helm manager) abre PR aqui. O arquétipo traz todos os
# defaults da plataforma (labels+governança, securityContext, resources, probes).
dependencies:
  - name: ${{ values.archetype }}
    version: "2.0.0"
    repository: oci://ghcr.io/tourinhom/charts
