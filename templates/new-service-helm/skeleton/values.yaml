# Parâmetros COMUNS do app — materializados pelo config-sync a partir do
# service.yaml do repo de código (o dev edita lá; máquina escreve aqui).
# NÃO tem image: a imagem é POR AMBIENTE (values/<env>.yaml), promovida pelo
# CI/Kargo. Valores sob a chave do arquétipo (nome do subchart).
${{ values.archetype }}:
  team: ${{ values.system }}
  system: ${{ values.system }}
  port: 8080
  memory: 256Mi
  replicas: 2
  health:
    readiness: /health
    liveness: /health
