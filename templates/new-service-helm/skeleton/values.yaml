# Só o ESPECÍFICO do app; todo o resto vem de ${{ values.archetype }}@2.0.0.
# Os valores entram sob a chave do arquétipo (nome do subchart).
${{ values.archetype }}:
  # team é required no arquétipo (governança — antídoto ao "indefinido").
  # Derivado do system no scaffold; ajuste pro squad dono no day-2.
  team: ${{ values.system }}
  system: ${{ values.system }}
  # Imagem publicada pelo CI do repo de código (semantic-release: 1º release = 1.0.0).
  # Renovate (datasource docker) bumpa este tag conforme o CI publica versões novas.
  image: ghcr.io/tourinho-labs/${{ values.name }}:1.0.0
