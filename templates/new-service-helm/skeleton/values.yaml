# BASE — materializada pelo config-sync a partir de tools/microsservico/values.yaml
# do repo de código (o dev edita lá; máquina copia aqui). Sem image (é do Kargo,
# values/<env>.image.yaml) e sem host (é do ApplicationSet, global.*). Valores sob
# a chave do arquétipo (nome do subchart).
${{ values.archetype }}:
  team: ${{ values.system }}
  system: ${{ values.system }}
  port: 8080
  replicas: 2
  perfil: 2-api
