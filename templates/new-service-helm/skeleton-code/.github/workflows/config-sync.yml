name: Config Sync

# Quando o dev edita o service.yaml (push na main), sincroniza os parâmetros
# pro values.yaml do repo de gitops (gitops-<app>), que o dev não acessa.
# A escrita cross-repo é via token do RELEASE_APP no reusable (separation of
# duties: dev mexe no contrato, máquina materializa o deploy).
on:
  push:
    branches: [main]
    paths:
      - service.yaml

jobs:
  config-sync:
    permissions:
      contents: read
    uses: TourinhoM/org-ci-platform/.github/workflows/config-sync-helm.yml@main
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
