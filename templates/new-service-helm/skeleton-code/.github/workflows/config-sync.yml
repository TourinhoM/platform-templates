name: Config Sync

# Quando o dev edita o contrato (tools/microsservico/**, push na main), sincroniza
# os values pro repo de gitops (gitops-<app>), que o dev não acessa. A escrita
# cross-repo é via token do RELEASE_APP no reusable (separation of duties: dev
# mexe no contrato, máquina materializa o deploy). Image = Kargo, não passa aqui.
on:
  push:
    branches: [main]
    paths:
      - tools/microsservico/**

jobs:
  config-sync:
    permissions:
      contents: read
    uses: TourinhoM/org-ci-platform/.github/workflows/config-sync-helm.yml@main
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
