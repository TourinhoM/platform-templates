apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-service-combo
  title: New Service
  description: Cria um novo serviço Fastify com CI e observabilidade. Opcionalmente inclui manifests Kubernetes para deploy no cluster.
  tags:
    - nodejs
    - fastify
    - service
    - kubernetes
spec:
  owner: group:default/platform-engineering
  type: service

  parameters:
    - title: Novo serviço
      required: [name, description, system]
      properties:
        name:
          title: Nome
          type: string
          description: kebab-case — vira o nome do repo e do componente (ex. app-payments)
          pattern: '^[a-z][a-z0-9-]+$'
          ui:autofocus: true
        description:
          title: Descrição
          type: string
          description: O que esse serviço faz?
        system:
          title: System
          type: string
          description: A qual system este serviço pertence
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
            defaultKind: System
            allowArbitraryValues: false
        includeK8s:
          title: Incluir manifests Kubernetes?
          type: boolean
          default: false
          description: Gera kustomization + AppNamespace para deploy no cluster

    - title: Deploy
      if: ${{ parameters.includeK8s == true }}
      properties:
        teamName:
          title: Nome do time (AppNamespace)
          type: string
          description: Provisiona o namespace no cluster. Vazio = usa o nome do serviço.
        cpuLimit:
          title: CPU limit
          type: string
          default: "2"
        memoryLimit:
          title: Memory limit
          type: string
          default: 2Gi

  steps:
    - id: fetch-base
      name: Montar esqueleto base
      action: fetch:template
      input:
        url: ../new-service/skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ user.ref }}
          system: ${{ parameters.system }}
          includeK8s: ${{ parameters.includeK8s }}

    - id: fetch-k8s
      name: Adicionar manifests k8s
      if: ${{ parameters.includeK8s == true }}
      action: fetch:template
      input:
        url: ../new-service-full/skeleton/k8s
        targetPath: k8s
        values:
          name: ${{ parameters.name }}
          teamName: ${{ parameters.teamName or parameters.name }}
          cpuLimit: ${{ parameters.cpuLimit }}
          memoryLimit: ${{ parameters.memoryLimit }}

    - $yaml: ../_shared/step-publish.yaml

    - $yaml: ../_shared/step-register.yaml

  output:
    $yaml: ../_shared/output.yaml
