apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-service-combo
  title: New Service
  description: Cria um novo serviço Fastify com CI e observabilidade. Opcionalmente inclui manifests Kubernetes para deploy no cluster.
  tags:
    - nodejs
    - fastify
    - service
    - kubernetes
spec:
  owner: group:default/platform-engineering
  type: service

  parameters:
    - title: Tipo de serviço
      properties:
        includeK8s:
          title: Incluir manifests Kubernetes?
          type: boolean
          default: false
          description: Gera kustomization + AppNamespace para deploy no cluster (1+1 ou 1+2)

    - title: Sobre o serviço
      required: [name, description, owner]
      properties:
        name:
          title: Nome
          type: string
          description: Nome em kebab-case (ex. app-payments)
          pattern: '^[a-z][a-z0-9-]+$'
          ui:autofocus: true
        title:
          title: Título
          type: string
          description: Nome amigável exibido no catalog (opcional)
        description:
          title: Descrição
          type: string
          description: O que esse serviço faz?
        type:
          title: Tipo
          type: string
          description: Tipo de componente (catalog-model)
          default: service
          enum: [service, website, library]
        lifecycle:
          title: Lifecycle
          type: string
          default: experimental
          enum: [experimental, production, deprecated]
        owner:
          title: Owner
          type: string
          description: Time ou pessoa dona do serviço
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              - kind: [Group, User]
        system:
          title: Sistema
          type: string
          description: Sistema ao qual o componente pertence
          default: platform-lab
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
            allowArbitraryValues: true
        tags:
          title: Tags
          type: array
          description: Tags reaproveitadas do catalog (autocomplete)
          ui:field: EntityTagsPicker

    - title: Relações
      properties:
        dependsOn:
          title: Depende de
          type: array
          description: Components ou Resources dos quais este serviço depende
          ui:field: MultiEntityPicker
          ui:options:
            catalogFilter:
              kind: [Component, Resource]
        providesApis:
          title: APIs fornecidas
          type: array
          description: APIs que este serviço expõe
          ui:field: MultiEntityPicker
          ui:options:
            catalogFilter:
              kind: API

    - title: Deploy
      if: ${{ parameters.includeK8s == true }}
      required: [teamName]
      properties:
        teamName:
          title: Nome do time (AppNamespace)
          type: string
          description: Usado para provisionar o namespace no cluster
        cpuLimit:
          title: CPU limit
          type: string
          default: "2"
        memoryLimit:
          title: Memory limit
          type: string
          default: 2Gi

    - title: Repositório
      required: [repoUrl]
      properties:
        repoUrl:
          title: Localização do repositório
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - tourinho-labs

  steps:
    - id: fetch-base
      name: Montar esqueleto base
      action: fetch:template
      input:
        url: ../new-service/skeleton
        values:
          name: ${{ parameters.name }}
          title: ${{ parameters.title or '' }}
          description: ${{ parameters.description }}
          type: ${{ parameters.type }}
          lifecycle: ${{ parameters.lifecycle }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          tags: ${{ parameters.tags or [] }}
          dependsOn: ${{ parameters.dependsOn or [] }}
          providesApis: ${{ parameters.providesApis or [] }}
          repoSlug: ${{ (parameters.repoUrl | parseRepoUrl).owner }}/${{ (parameters.repoUrl | parseRepoUrl).repo }}
          includeK8s: ${{ parameters.includeK8s }}

    - id: fetch-k8s
      name: Adicionar manifests k8s
      if: ${{ parameters.includeK8s == true }}
      action: fetch:template
      input:
        url: ../new-service-full/skeleton/k8s
        targetPath: k8s
        values:
          name: ${{ parameters.name }}
          teamName: ${{ parameters.teamName }}
          cpuLimit: ${{ parameters.cpuLimit }}
          memoryLimit: ${{ parameters.memoryLimit }}

    - id: publish
      name: Criar repositório no GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: register
      name: Registrar no catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repositório
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Ver no catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
