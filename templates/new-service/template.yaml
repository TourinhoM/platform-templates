apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-service
  title: New Service (1+1)
  description: Cria um novo serviço Fastify com CI e observabilidade. Registra automaticamente no catalog.
  tags:
    - nodejs
    - fastify
    - service
spec:
  owner: group:default/platform-engineering
  type: service

  parameters:
    - title: Novo serviço
      required: [name, description]
      properties:
        name:
          title: Nome
          type: string
          description: kebab-case — vira o nome do repo e do componente (ex. app-payments)
          pattern: '^[a-z][a-z0-9-]+$'
          ui:autofocus: true
        description:
          title: Descrição
          type: string
          description: O que esse serviço faz?

  steps:
    - id: fetch
      name: Montar esqueleto
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ user.ref }}
          includeK8s: false

    - id: publish
      name: Criar repositório no GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: github.com?owner=tourinho-labs&repo=${{ parameters.name }}
        defaultBranch: main

    - id: register
      name: Registrar no catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repositório
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Ver no catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
