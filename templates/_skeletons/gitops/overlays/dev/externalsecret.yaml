# Capability DATABASE — artefato day-2 (par do binding components/bindings/database).
# O CI de promoção (declarar `database` no repo da app) deposita ESTE manifesto +
# a ref do binding no gitops, por overlay. O dev NÃO escreve isto à mão.
#
# Materializa o Secret de contrato `db-conn` no namespace da app, lendo a conexão
# do Vault (onde o Crossplane/RDS deposita — `crossplane-write`; no lab, stand-in
# apontando pro postgres in-cluster). ESO sincroniza → binding consome via envFrom.
#
# Placeholders __ENV__ e __APP__ são preenchidos pelo CI por overlay (A4); o
# `{{ .x }}` é template do ESO (engine v2) e fica intacto.
#
# Day-2 birth: no day-1 a app sobe SEM isto (sem db-conn, sem binding). Quando o
# dev declara o banco, este ExternalSecret nasce → ESO cria db-conn em segundos →
# o binding (envFrom) liga → pod rola conectado. Sem Reloader, sem provisionamento.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-conn
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: db-conn            # contrato fixo: components/bindings/database consome
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_HOST: "{{ .host }}"
        DATABASE_PORT: "{{ .port }}"
        DATABASE_NAME: "{{ .dbname }}"
        DATABASE_USER: "{{ .user }}"
        DATABASE_PASSWORD: "{{ .password }}"
        DATABASE_URL: "postgresql://{{ .user }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}"
  # Lê todas as chaves (host/port/dbname/user/password) de UM path do Vault.
  # Convenção: databases/<env>/<app> — o env vem do overlay (A3), o app do nome.
  dataFrom:
    - extract:
        key: databases/dev/__APP__
