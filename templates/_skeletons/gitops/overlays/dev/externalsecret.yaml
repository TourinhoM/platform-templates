# Materializa o Secret db-conn no namespace da app, lendo a conexão do Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-conn
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: db-conn            # contrato fixo: components/bindings/database consome
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_HOST: "{{ .host }}"
        DATABASE_PORT: "{{ .port }}"
        DATABASE_NAME: "{{ .dbname }}"
        DATABASE_USER: "{{ .user }}"
        DATABASE_PASSWORD: "{{ .password }}"
        DATABASE_URL: "postgresql://{{ .user }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}"
  # Lê todas as chaves de um path do Vault (databases/<env>/<app>).
  dataFrom:
    - extract:
        key: databases/dev/__APP__
