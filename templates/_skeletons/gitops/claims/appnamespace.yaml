apiVersion: platform.lab/v1alpha1
kind: AppNamespace
metadata:
  name: ${{ values.name }}
  namespace: default
spec:
  teamName: ${{ values.teamName }}
  # Mesmo profile que dirige os resources do container (size-<profile> no
  # kustomization) → aqui vira a ResourceQuota do namespace.
  size: ${{ values.profile }}
