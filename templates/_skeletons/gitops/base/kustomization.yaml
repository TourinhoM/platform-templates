apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# BASE — tudo agnóstico de ambiente. Os overlays/{dev,hml,prod} referenciam este
# base e só acrescentam o que varia: a claim AppNamespace (name <app>-<env>), o
# ExternalSecret (path do Vault por env) e o images.newTag (promoção por env).
# Sem namespace aqui: quem define é o destination.namespace do ApplicationSet
# (<app>-<env>); sem images aqui: o newTag mora no overlay.
components:
  - https://github.com/TourinhoM/platform-app-base//components/workload?ref=main
  - https://github.com/TourinhoM/platform-app-base//components/metrics?ref=main
{%- if values.exposeHttp %}
  - https://github.com/TourinhoM/platform-app-base//components/http?ref=main
{%- endif %}
{%- if values.autoscaling %}
  - https://github.com/TourinhoM/platform-app-base//components/availability?ref=main
{%- endif %}
{%- if values.connectDatabase %}
  - https://github.com/TourinhoM/platform-app-base//components/bindings/database?ref=main
{%- endif %}

# resources: o dev seta só a memória (mesma nos 3 envs por ora; override per-env é
# incremento futuro do platform.yaml). CPU/requests fixos do workload base.
patches:
  - target: { kind: Deployment }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: ${{ values.memLimit }}

# Label p/ o plugin Kubernetes do Backstage descobrir os workloads dos 3 envs
# (mesmo kubernetes-id → o componente mostra dev/hml/prod juntos).
labels:
  - pairs:
      backstage.io/kubernetes-id: ${{ values.name }}
    includeSelectors: false
    includeTemplates: true

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: app-config
    literals:
      - name=${{ values.name }}
      # hostname sempre presente (inócuo sem Ingress): ligar http no day-2 vira
      # só o toggle do component, sem mexer aqui.
      - hostname=${{ values.name }}.local
  # env vars não-sensíveis em env.properties (arquivo plano). Mudança = novo hash
  # do app-env → Argo rola o pod nativamente (sem Reloader). Segredos NUNCA aqui.
  - name: app-env
    envs:
      - env.properties
