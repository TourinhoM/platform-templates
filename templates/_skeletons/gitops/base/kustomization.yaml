apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base agnóstica de ambiente; overlays acrescentam o que varia.
components:
  - https://github.com/TourinhoM/platform-app-base//components/workload?ref=main
  - https://github.com/TourinhoM/platform-app-base//components/metrics?ref=main
{%- if values.exposeHttp %}
  - https://github.com/TourinhoM/platform-app-base//components/http?ref=main
{%- endif %}
{%- if values.autoscaling %}
  - https://github.com/TourinhoM/platform-app-base//components/availability?ref=main
{%- endif %}
{%- if values.connectDatabase %}
  - https://github.com/TourinhoM/platform-app-base//components/bindings/database?ref=main
{%- endif %}

# Label p/ o plugin Kubernetes do Backstage descobrir os workloads.
labels:
  - pairs:
      backstage.io/kubernetes-id: ${{ values.name }}
    includeSelectors: false
    includeTemplates: true

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: app-config
    literals:
      - name=${{ values.name }}
      # hostname sempre presente.
      - hostname=${{ values.name }}.local
      # paths das probes.
      - healthReadiness=${{ values.healthReadiness }}
      - healthLiveness=${{ values.healthLiveness }}
      # memLimit → resources.limits.memory.
      - memLimit=${{ values.memLimit }}
  # env vars não-sensíveis em env.properties; segredos nunca aqui.
  - name: app-env
    envs:
      - env.properties
