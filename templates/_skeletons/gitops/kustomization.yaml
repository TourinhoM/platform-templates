apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Compõe o golden path a partir dos fragments do platform-app-base.
# workload + metrics sempre (comum a qualquer microserviço); o size patcha os
# resources do container conforme o profile (mesmo profile dirige a quota na
# Claim AppNamespace); http e availability entram conforme o scaffolder.
components:
  - https://github.com/TourinhoM/platform-app-base//components/workload?ref=main
  - https://github.com/TourinhoM/platform-app-base//components/metrics?ref=main
  - https://github.com/TourinhoM/platform-app-base//components/size-${{ values.profile }}?ref=main
{%- if values.exposeHttp %}
  - https://github.com/TourinhoM/platform-app-base//components/http?ref=main
{%- endif %}
{%- if values.autoscaling %}
  - https://github.com/TourinhoM/platform-app-base//components/availability?ref=main
{%- endif %}

resources:
  - claims/appnamespace.yaml

# Label em metadata e no pod template (não nos selectors imutáveis) para o
# plugin Kubernetes do Backstage descobrir os workloads E os pods via kubernetes-id.
labels:
  - pairs:
      backstage.io/kubernetes-id: ${{ values.name }}
    includeSelectors: false
    includeTemplates: true

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: app-config
    literals:
      - name=${{ values.name }}
      # hostname sempre presente (inócuo sem Ingress): mata a condicional —
      # ligar http no day-2 vira só o toggle do component, sem mexer aqui.
      - hostname=${{ values.name }}.local
  # env vars não-sensíveis moram em env.properties (arquivo plano): edição
  # day-2 = append/merge de linha via Backstage, nunca mudança estrutural.
  # O envFrom (optional) do app-base consome; Reloader rola o pod na mudança.
  - name: app-env
    envs:
      - env.properties

images:
  - name: app-image
    newName: ghcr.io/tourinho-labs/${{ values.name }}
    newTag: latest
