apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay prod — só o que varia por ambiente; herda de ../../base.
resources:
  - ../../base
  - claims/appnamespace.yaml
{%- if values.connectDatabase %}
  - claims/appdatabase.yaml
  - externalsecret.yaml
{%- endif %}

# newTag por ambiente: a promoção escreve aqui.
images:
  - name: app-image
    newName: ghcr.io/tourinho-labs/${{ values.name }}
    newTag: ${{ values.newTag or "latest" }}
