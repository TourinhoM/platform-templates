name: Render GitOps

# Day-2: push no platform.yaml re-renderiza o repo gitops-<app>.
on:
  push:
    branches:
      - main
    paths:
      - platform.yaml

jobs:
  render:
    permissions:
      contents: read
    # secrets explícito: inherit não atravessa a org.
    uses: TourinhoM/org-ci-platform/.github/workflows/render-gitops.yml@main
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
