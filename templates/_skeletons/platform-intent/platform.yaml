# platform.yaml — contrato com a plataforma; edite e dê push pra re-renderizar o gitops.
name: ${{ values.name }}

# --- knobs opcionais (descomente pra sobrescrever o default) ---
#
# database: true      # provisiona um banco por ambiente + conecta o serviço.
# http: false         # serviço interno (sem Ingress + Certificate).
# autoscaling: false  # réplica fixa (1), sem HPA/PDB.
# memory: 512Mi       # limite de memória do container (default 256Mi).
# team: meu-time      # dono do AppNamespace (default: deriva do name).
