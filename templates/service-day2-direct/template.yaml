apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: service-day2-direct
  title: Edit Service · size (day-2)
  description: Muda o size de um serviço existente — commit direto no gitops repo (sem PR; form = aprovação). Atualiza resources do container E quota do namespace num commit atômico.
  tags:
    - day-2
    - service
spec:
  owner: group:default/platform-engineering
  type: service

  parameters:
    - title: O que mudar
      required: [component, size]
      properties:
        component:
          title: Serviço
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Component
            defaultKind: Component
            allowArbitraryValues: false
        size:
          title: Novo size
          type: string
          enum: [small, medium, large]
          enumNames:
            - 'small · pod até 200m CPU / 256Mi · namespace 1 CPU / 1Gi'
            - 'medium · pod até 1 CPU / 512Mi · namespace 4 CPU / 4Gi'
            - 'large · pod até 2 CPU / 1Gi · namespace 8 CPU / 8Gi'

  # Edição in-place de alvos edit-friendly (formato máquina-estável): o size
  # vive em 2 materializações no MESMO repo — component do kustomization
  # (resources do container) e claim AppNamespace (quota) — e o commit
  # atômico garante coerência. Sem PR e sem CI no caminho: form = aprovação,
  # lint do gitops + quota do cluster = gates.
  steps:
    - id: fetch
      name: Buscar gitops repo
      action: fetch:plain
      input:
        url: https://github.com/tourinho-labs/gitops-${{ (parameters.component | parseEntityRef).name }}

    - id: edit
      name: Aplicar novo size (container + quota)
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: kustomization.yaml
            matchRegex: true
            find: 'components/size-(small|medium|large)\?ref=main'
            replaceWith: 'components/size-${{ parameters.size }}?ref=main'
          - file: claims/appnamespace.yaml
            matchRegex: true
            find: 'size: (small|medium|large)'
            replaceWith: 'size: ${{ parameters.size }}'

    - id: push
      name: Commit direto no gitops repo
      action: platform:github:commit
      input:
        repoUrl: github.com?owner=tourinho-labs&repo=gitops-${{ (parameters.component | parseEntityRef).name }}
        branch: main
        message: 'chore(day2): size=${{ parameters.size }} via Backstage'
        files:
          - kustomization.yaml
          - claims/appnamespace.yaml

  output:
    links:
      - title: Commit no gitops repo
        url: ${{ steps.push.output.commitUrl }}
      - title: Argo CD (sync em instantes)
        url: https://argocd.local/applications/${{ (parameters.component | parseEntityRef).name }}
