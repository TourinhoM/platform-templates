# Publica o repo de deploy gitops-<nome> a partir do subdir ./gitops do workspace.
id: publishGitops
name: Criar repositório de deploy (gitops)
action: publish:github
input:
  description: 'Deploy manifests (kustomize) de ${{ parameters.name }}'
  repoUrl: github.com?owner=tourinho-labs&repo=gitops-${{ parameters.name }}
  defaultBranch: main
  sourcePath: gitops
  # Padrão da org: repos públicos.
  repoVisibility: public
  # gitops/main é machine-owned: Kargo e config-sync dão push direto no main.
  protectDefaultBranch: false
  gitCommitMessage: 'feat: scaffold gitops-${{ parameters.name }} via Backstage'
