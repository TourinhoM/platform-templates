# Publica o repo de código a partir do subdir ./code do workspace.
id: publish
name: Criar repositório do serviço
action: publish:github
input:
  description: ${{ parameters.description }}
  repoUrl: github.com?owner=tourinho-labs&repo=${{ parameters.name }}
  defaultBranch: main
  sourcePath: code
  # Padrão da org: repos públicos.
  repoVisibility: public
  # Conventional commit no commit inicial.
  gitCommitMessage: 'feat: scaffold ${{ parameters.name }} via Backstage'
