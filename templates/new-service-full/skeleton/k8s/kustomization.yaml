apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - https://github.com/TourinhoM/platform-app-base//base?ref=main

resources:
  - claims/appnamespace.yaml

# Label em metadata de todos os recursos (não nos selectors) para o
# plugin Kubernetes do Backstage descobrir os workloads via kubernetes-id.
labels:
  - pairs:
      backstage.io/kubernetes-id: ${{ values.name }}
    includeSelectors: false

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: app-config
    literals:
      - name=${{ values.name }}
      - hostname=${{ values.name }}.local

images:
  - name: app-image
    newName: ghcr.io/tourinho-labs/${{ values.name }}
    newTag: latest
