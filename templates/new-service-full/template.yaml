apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-service-full
  title: Microsserviço
  description: Serviço HTTP pronto pra rodar — CI, observabilidade e deploy contínuo no cluster. Pode já nascer conectado a um banco existente.
  tags:
    - nodejs
    - fastify
    - service
    - kubernetes
spec:
  owner: group:default/platform-engineering
  type: service

  parameters:
    - $yaml: ../_shared/params-service.yaml

    - title: Deploy (opcional — tem defaults)
      properties:
        teamName:
          title: Nome do time (AppNamespace)
          type: string
          description: Provisiona o namespace no cluster. Vazio = usa o nome do serviço.
        # Memória da app — o resto dos resources (CPU, requests) é fixo da
        # plataforma. Default cobre o caso comum; editável ao nascer e no day-2.
        memLimit:
          title: Memória
          type: string
          default: 256Mi
        exposeHttp:
          title: Expõe HTTP? (Ingress + Certificate)
          type: boolean
          description: Desmarque para microserviço interno (sem entrada HTTP externa).
          default: true
        autoscaling:
          title: Autoscaling? (HPA + PDB)
          type: boolean
          default: false
        connectDatabase:
          title: Integração com banco de dados
          type: boolean
          description: Conecta o serviço a um banco EXISTENTE (não cria banco). Pode ligar depois também.
          default: false

  # Padrão de dois repos: o esqueleto de código vai pra ./code e o de deploy
  # pra ./gitops no workspace; cada step-publish-* sobe só o seu sourcePath.
  # Os steps publish/output são snippets compartilhados em _shared/ — quando
  # outro template adotar o mesmo padrão, reusa os mesmos arquivos.
  steps:
    - id: fetch-code
      name: Montar esqueleto do serviço
      action: fetch:template
      input:
        url: ../new-service/skeleton
        targetPath: code
        # Workflows usam ${{ }} do GitHub Actions, que colide com o template
        # do scaffolder — copia verbatim pra não esvaziar secrets/vars/github.
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ user.ref }}
          system: ${{ parameters.system }}
          # Mantém as anotações de deploy (kubernetes-id, argocd, kyverno) no
          # catalog-info do serviço, mesmo com os manifests no repo gitops.
          includeK8s: true

    # platform.yaml (SSOT) + callers de CI do day-2, no repo de CÓDIGO. Skeleton
    # separado (não o de código compartilhado) porque só o Microsserviço tem
    # gitops repo — o new-service standalone não pode receber render.yml.
    # platform.yaml é templatizado dos toggles; os workflows vão verbatim
    # (têm ${{ }} de GitHub Actions). Day-1 e day-2 ficam consistentes porque o
    # renderer lê esses mesmos valores de volta.
    - id: fetch-platform-intent
      name: Emitir platform.yaml + CI day-2
      action: fetch:template
      input:
        url: ../_skeletons/platform-intent
        targetPath: code
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}
          team: ${{ parameters.teamName }}
          memLimit: ${{ parameters.memLimit }}
          exposeHttp: ${{ parameters.exposeHttp }}
          autoscaling: ${{ parameters.autoscaling }}
          connectDatabase: ${{ parameters.connectDatabase }}

    - id: fetch-gitops
      name: Montar esqueleto de deploy (gitops)
      action: fetch:template
      input:
        # Skeleton compartilhado em _skeletons/gitops — reusável por qualquer
        # template que adote o padrão de 2 repos (não é dono do new-service-full).
        url: ../_skeletons/gitops
        targetPath: gitops
        # Rende base/ + overlays/{dev,hml,prod}. Verbatim: workflows (${{ }} do
        # Actions) e os ExternalSecrets dos overlays (preservam o {{ }} do ESO;
        # o env já vem baked em cada overlay, só falta o __APP__).
        copyWithoutTemplating:
          - .github/workflows/**
          - overlays/*/externalsecret.yaml
        values:
          name: ${{ parameters.name }}
          teamName: ${{ parameters.teamName or parameters.name }}
          memLimit: ${{ parameters.memLimit }}
          exposeHttp: ${{ parameters.exposeHttp }}
          autoscaling: ${{ parameters.autoscaling }}
          connectDatabase: ${{ parameters.connectDatabase }}

    # Integração com banco (opcional): os ExternalSecrets já vêm nos overlays
    # (env baked, db-conn). Com banco → preenche o __APP__ nos 3; sem banco →
    # remove os 3 (o kustomization de cada overlay já não os referencia via
    # condicional, mas tirar o arquivo evita órfão no git). Mesma lógica que o
    # renderer day-2 faz (subtrativo), pra day-1 e day-2 convergirem.
    - id: fill-database
      if: ${{ parameters.connectDatabase }}
      name: Preencher app do ExternalSecret (por overlay)
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: gitops/overlays/dev/externalsecret.yaml
            find: __APP__
            replaceWith: ${{ parameters.name }}
          - file: gitops/overlays/hml/externalsecret.yaml
            find: __APP__
            replaceWith: ${{ parameters.name }}
          - file: gitops/overlays/prod/externalsecret.yaml
            find: __APP__
            replaceWith: ${{ parameters.name }}
    - id: drop-database
      if: ${{ not parameters.connectDatabase }}
      name: Remover ExternalSecrets (sem banco)
      # fs:delete é built-in do scaffolder — o roadiehq:utils não tem delete.
      action: fs:delete
      input:
        files:
          - gitops/overlays/dev/externalsecret.yaml
          - gitops/overlays/hml/externalsecret.yaml
          - gitops/overlays/prod/externalsecret.yaml

    - $yaml: ../_shared/step-publish-code.yaml

    - $yaml: ../_shared/step-publish-gitops.yaml

    - $yaml: ../_shared/step-register.yaml

  output:
    $yaml: ../_shared/output-gitops.yaml
