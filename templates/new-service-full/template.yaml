apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-service-full
  title: Microsserviço
  description: Serviço HTTP pronto pra rodar — CI, observabilidade e deploy contínuo no cluster. Nasce completo (HTTP, autoscaling, observabilidade); banco é opt-in editando o platform.yaml.
  tags:
    - nodejs
    - fastify
    - service
    - kubernetes
spec:
  owner: group:default/platform-engineering
  type: service

  # Form pergunta só identidade (name/description/system). Os knobs de deploy
  # NÃO moram no Backstage de propósito: o serviço nasce com os defaults do
  # contrato (tudo ligado menos banco) e o dev edita o platform.yaml no day-2 se
  # quiser mudar — superfície única, sem seleção que ninguém revisa no scaffold.
  parameters:
    - $yaml: ../_shared/params-service.yaml

  # Padrão de dois repos: o esqueleto de código vai pra ./code e o de deploy
  # pra ./gitops no workspace; cada step-publish-* sobe só o seu sourcePath.
  # Os steps publish/output são snippets compartilhados em _shared/ — quando
  # outro template adotar o mesmo padrão, reusa os mesmos arquivos.
  steps:
    - id: fetch-code
      name: Montar esqueleto do serviço
      action: fetch:template
      input:
        url: ../new-service/skeleton
        targetPath: code
        # Workflows usam ${{ }} do GitHub Actions, que colide com o template
        # do scaffolder — copia verbatim pra não esvaziar secrets/vars/github.
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ user.ref }}
          system: ${{ parameters.system }}
          # Mantém as anotações de deploy (kubernetes-id, argocd, kyverno) no
          # catalog-info do serviço, mesmo com os manifests no repo gitops.
          includeK8s: true

    # platform.yaml (SSOT) + callers de CI do day-2, no repo de CÓDIGO. Skeleton
    # separado (não o de código compartilhado) porque só o Microsserviço tem
    # gitops repo — o new-service standalone não pode receber render.yml.
    # platform.yaml nasce MÍNIMO (só name): todo o resto cai nos defaults do
    # contrato (tudo on menos banco), aplicados pelo renderer day-2 a partir do
    # schema.json. Os workflows vão verbatim (${{ }} do Actions). Não há mais
    # constantes de deploy no day-1 — o gitops é materializado só no day-2,
    # então não há como o day-1 driftar do schema (fonte única dos defaults).
    - id: fetch-platform-intent
      name: Emitir platform.yaml + CI day-2
      action: fetch:template
      input:
        url: ../_skeletons/platform-intent
        targetPath: code
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}

    # O CONTEÚDO do gitops NÃO é renderizado no day-1. O renderer day-2
    # (render-gitops, mesmo render.js, defaults herdados do schema.json) é o
    # ÚNICO que materializa base/ + overlays/dev + stages/{hml,prod}. Assim os
    # defaults moram num lugar só (o contrato) — sem constantes duplicadas aqui
    # que poderiam driftar do schema. O day-1 só cria o repo com um README; o
    # primeiro push de platform.yaml dispara o render que popula o resto.
    # (Como o banco nasce off por default, também não há nada de DB pra remover
    # aqui — o render day-2 só emite os artefatos de banco quando database:true.)
    - id: fetch-gitops-bootstrap
      name: Bootstrap do repo de deploy (gitops)
      action: fetch:template
      input:
        url: ../_skeletons/gitops-bootstrap
        targetPath: gitops
        values:
          name: ${{ parameters.name }}

    - $yaml: ../_shared/step-publish-code.yaml

    - $yaml: ../_shared/step-publish-gitops.yaml

    - $yaml: ../_shared/step-register.yaml

  output:
    $yaml: ../_shared/output-gitops.yaml
