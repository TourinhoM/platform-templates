apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-service-full
  title: New Service + Deploy (1+2)
  description: Cria um novo serviço Fastify com CI, observabilidade e manifests k8s (kustomize + AppNamespace). Registra automaticamente no catalog.
  tags:
    - nodejs
    - fastify
    - service
    - kubernetes
spec:
  owner: group:default/platform
  type: service

  parameters:
    - title: Informações do serviço
      required: [name, description, owner]
      properties:
        name:
          title: Nome
          type: string
          description: Nome em kebab-case (ex. app-payments)
          pattern: '^[a-z][a-z0-9-]+$'
          ui:autofocus: true
        description:
          title: Descrição
          type: string
          description: O que esse serviço faz?
        owner:
          title: Dono
          type: string
          description: Time responsável
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        system:
          title: Sistema
          type: string
          default: platform-lab

    - title: Deploy
      required: [teamName]
      properties:
        teamName:
          title: Nome do time (AppNamespace)
          type: string
          description: Usado para provisionar o namespace no cluster
        cpuLimit:
          title: CPU limit
          type: string
          default: "2"
        memoryLimit:
          title: Memory limit
          type: string
          default: 2Gi

    - title: Repositório
      required: [repoUrl]
      properties:
        repoUrl:
          title: Localização do repositório
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - TourinhoM

  steps:
    - id: fetch-base
      name: Montar esqueleto base
      action: fetch:template
      input:
        url: ../new-service/skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}

    - id: fetch-k8s
      name: Adicionar manifests k8s
      action: fetch:template
      input:
        url: ./skeleton/k8s
        targetPath: k8s
        values:
          name: ${{ parameters.name }}
          teamName: ${{ parameters.teamName }}
          cpuLimit: ${{ parameters.cpuLimit }}
          memoryLimit: ${{ parameters.memoryLimit }}

    - id: publish
      name: Criar repositório no GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: register
      name: Registrar no catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repositório
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Ver no catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
