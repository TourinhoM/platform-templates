apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-service-full
  title: Microsserviço
  description: Serviço HTTP pronto pra rodar — CI, observabilidade e deploy contínuo no cluster. Nasce completo (HTTP, autoscaling, observabilidade); banco é opt-in editando o platform.yaml.
  tags:
    - nodejs
    - fastify
    - service
    - kubernetes
spec:
  owner: group:default/platform-engineering
  type: service

  # Form pergunta só identidade; knobs de deploy ficam no platform.yaml.
  parameters:
    - $yaml: ../_shared/params-service.yaml

  # Padrão de dois repos: código vai pra ./code, deploy pra ./gitops.
  steps:
    - id: fetch-code
      name: Montar esqueleto do serviço
      action: fetch:template
      input:
        url: ../new-service/skeleton
        targetPath: code
        # Workflows têm ${{ }} de Actions: copia verbatim.
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ user.ref }}
          system: ${{ parameters.system }}
          # Mantém as anotações de deploy no catalog-info.
          includeK8s: true

    # Emite o platform.yaml e os callers de CI day-2 no repo de código.
    - id: fetch-platform-intent
      name: Emitir platform.yaml + CI day-2
      action: fetch:template
      input:
        url: ../_skeletons/platform-intent
        targetPath: code
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}

    # Cria o repo de deploy com README + CI do gitops; o conteúdo é renderizado no day-2.
    - id: fetch-gitops-bootstrap
      name: Bootstrap do repo de deploy (gitops)
      action: fetch:template
      input:
        url: ../_skeletons/gitops-bootstrap
        targetPath: gitops
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}

    - $yaml: ../_shared/step-publish-code.yaml

    - $yaml: ../_shared/step-publish-gitops.yaml

    # Sem catalog:register: o auto-discovery é o dono do registro.

  output:
    $yaml: ../_shared/output-gitops.yaml
