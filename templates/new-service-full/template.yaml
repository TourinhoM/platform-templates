apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-service-full
  title: New Service + Deploy (1+2)
  description: Cria um novo serviço Fastify com CI, observabilidade e manifests k8s (kustomize + AppNamespace). Registra automaticamente no catalog.
  tags:
    - nodejs
    - fastify
    - service
    - kubernetes
spec:
  owner: group:default/platform-engineering
  type: service

  parameters:
    - $yaml: ../_shared/params-service.yaml

    - title: Deploy (opcional — tem defaults)
      properties:
        teamName:
          title: Nome do time (AppNamespace)
          type: string
          description: Provisiona o namespace no cluster. Vazio = usa o nome do serviço.
        cpuLimit:
          title: CPU limit
          type: string
          default: "2"
        memoryLimit:
          title: Memory limit
          type: string
          default: 2Gi

  steps:
    - id: fetch-base
      name: Montar esqueleto base
      action: fetch:template
      input:
        url: ../new-service/skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ user.ref }}
          system: ${{ parameters.system }}
          includeK8s: true

    - id: fetch-k8s
      name: Adicionar manifests k8s
      action: fetch:template
      input:
        url: ./skeleton/k8s
        targetPath: k8s
        values:
          name: ${{ parameters.name }}
          teamName: ${{ parameters.teamName or parameters.name }}
          cpuLimit: ${{ parameters.cpuLimit }}
          memoryLimit: ${{ parameters.memoryLimit }}

    - $yaml: ../_shared/step-publish.yaml

    - $yaml: ../_shared/step-register.yaml

  output:
    $yaml: ../_shared/output.yaml
