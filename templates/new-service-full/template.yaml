apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-service-full
  title: Microsserviço
  description: Serviço HTTP pronto pra rodar — CI, observabilidade e deploy contínuo no cluster. Nasce completo (HTTP, autoscaling, observabilidade); banco é opt-in editando o platform.yaml.
  tags:
    - nodejs
    - fastify
    - service
    - kubernetes
spec:
  owner: group:default/platform-engineering
  type: service

  # Form pergunta só identidade (name/description/system). Os knobs de deploy
  # NÃO moram no Backstage de propósito: o serviço nasce com os defaults do
  # contrato (tudo ligado menos banco) e o dev edita o platform.yaml no day-2 se
  # quiser mudar — superfície única, sem seleção que ninguém revisa no scaffold.
  parameters:
    - $yaml: ../_shared/params-service.yaml

  # Padrão de dois repos: o esqueleto de código vai pra ./code e o de deploy
  # pra ./gitops no workspace; cada step-publish-* sobe só o seu sourcePath.
  # Os steps publish/output são snippets compartilhados em _shared/ — quando
  # outro template adotar o mesmo padrão, reusa os mesmos arquivos.
  steps:
    - id: fetch-code
      name: Montar esqueleto do serviço
      action: fetch:template
      input:
        url: ../new-service/skeleton
        targetPath: code
        # Workflows usam ${{ }} do GitHub Actions, que colide com o template
        # do scaffolder — copia verbatim pra não esvaziar secrets/vars/github.
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ user.ref }}
          system: ${{ parameters.system }}
          # Mantém as anotações de deploy (kubernetes-id, argocd, kyverno) no
          # catalog-info do serviço, mesmo com os manifests no repo gitops.
          includeK8s: true

    # platform.yaml (SSOT) + callers de CI do day-2, no repo de CÓDIGO. Skeleton
    # separado (não o de código compartilhado) porque só o Microsserviço tem
    # gitops repo — o new-service standalone não pode receber render.yml.
    # platform.yaml nasce MÍNIMO (só name): todo o resto cai nos defaults do
    # contrato (tudo on menos banco). Os workflows vão verbatim (${{ }} do
    # Actions). Day-1 e day-2 convergem porque o renderer aplica os MESMOS
    # defaults que o day-1 usa abaixo como constantes.
    - id: fetch-platform-intent
      name: Emitir platform.yaml + CI day-2
      action: fetch:template
      input:
        url: ../_skeletons/platform-intent
        targetPath: code
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}

    - id: fetch-gitops
      name: Montar esqueleto de deploy (gitops)
      action: fetch:template
      input:
        # Skeleton compartilhado em _skeletons/gitops — reusável por qualquer
        # template que adote o padrão de 2 repos (não é dono do new-service-full).
        url: ../_skeletons/gitops
        targetPath: gitops
        # Rende base/ + overlays/{dev,hml,prod}. Verbatim: workflows (${{ }} do
        # Actions) e os ExternalSecrets dos overlays (preservam o {{ }} do ESO;
        # o env já vem baked em cada overlay, só falta o __APP__).
        copyWithoutTemplating:
          - .github/workflows/**
          - overlays/*/externalsecret.yaml
        # Defaults do contrato como CONSTANTES no day-1 (não vêm mais do form):
        # tudo on (http + autoscaling), banco off. Têm que bater 1:1 com os
        # defaults do schema.json que o renderer day-2 aplica, senão o primeiro
        # push re-renderiza e gera drift.
        values:
          name: ${{ parameters.name }}
          teamName: ${{ parameters.name }}
          memLimit: 256Mi
          exposeHttp: true
          autoscaling: true
          connectDatabase: false

    # O serviço NASCE sem banco (database é opt-in no day-2). Os ExternalSecrets
    # vêm no skeleton dos overlays como gabarito (env baked, __APP__), então no
    # day-1 a gente sempre os remove pra não deixar órfão no git. Quando o dev
    # liga `database: true` no platform.yaml, é o renderer day-2 que recria os 3
    # ExternalSecrets + o binding + a claim de provisionamento (mesma lógica
    # subtrativa, agora do lado do renderer).
    - id: drop-database
      name: Remover artefatos de banco (opt-in no day-2)
      # fs:delete é built-in do scaffolder — o roadiehq:utils não tem delete.
      # Remove ExternalSecret + claim AppDatabase dos 3 overlays (banco nasce off;
      # o renderer day-2 recria ambos quando o dev liga `database: true`).
      action: fs:delete
      input:
        files:
          - gitops/overlays/dev/externalsecret.yaml
          - gitops/overlays/hml/externalsecret.yaml
          - gitops/overlays/prod/externalsecret.yaml
          - gitops/overlays/dev/claims/appdatabase.yaml
          - gitops/overlays/hml/claims/appdatabase.yaml
          - gitops/overlays/prod/claims/appdatabase.yaml

    - $yaml: ../_shared/step-publish-code.yaml

    - $yaml: ../_shared/step-publish-gitops.yaml

    - $yaml: ../_shared/step-register.yaml

  output:
    $yaml: ../_shared/output-gitops.yaml
