apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-service-full
  title: New Service + Deploy (2 repos)
  description: Cria um serviço Fastify (repo de código com CI + observabilidade) e um repo gitops-<nome> separado com os manifests k8s (kustomize + AppNamespace). Registra o serviço no catalog.
  tags:
    - nodejs
    - fastify
    - service
    - kubernetes
spec:
  owner: group:default/platform-engineering
  type: service

  parameters:
    - $yaml: ../_shared/params-service.yaml

    - title: Deploy (opcional — tem defaults)
      properties:
        teamName:
          title: Nome do time (AppNamespace)
          type: string
          description: Provisiona o namespace no cluster. Vazio = usa o nome do serviço.
        # Memória da app — o resto dos resources (CPU, requests) é fixo da
        # plataforma. Default cobre o caso comum; editável ao nascer e no day-2.
        memLimit:
          title: Memória
          type: string
          default: 256Mi
        exposeHttp:
          title: Expõe HTTP? (Ingress + Certificate)
          type: boolean
          description: Desmarque para microserviço interno (sem entrada HTTP externa).
          default: true
        autoscaling:
          title: Autoscaling? (HPA + PDB)
          type: boolean
          default: false

  # Padrão de dois repos: o esqueleto de código vai pra ./code e o de deploy
  # pra ./gitops no workspace; cada step-publish-* sobe só o seu sourcePath.
  # Os steps publish/output são snippets compartilhados em _shared/ — quando
  # outro template adotar o mesmo padrão, reusa os mesmos arquivos.
  steps:
    - id: fetch-code
      name: Montar esqueleto do serviço
      action: fetch:template
      input:
        url: ../new-service/skeleton
        targetPath: code
        # Workflows usam ${{ }} do GitHub Actions, que colide com o template
        # do scaffolder — copia verbatim pra não esvaziar secrets/vars/github.
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ user.ref }}
          system: ${{ parameters.system }}
          # Mantém as anotações de deploy (kubernetes-id, argocd, kyverno) no
          # catalog-info do serviço, mesmo com os manifests no repo gitops.
          includeK8s: true

    - id: fetch-gitops
      name: Montar esqueleto de deploy (gitops)
      action: fetch:template
      input:
        # Skeleton compartilhado em _skeletons/gitops — reusável por qualquer
        # template que adote o padrão de 2 repos (não é dono do new-service-full).
        url: ../_skeletons/gitops
        targetPath: gitops
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}
          teamName: ${{ parameters.teamName or parameters.name }}
          memLimit: ${{ parameters.memLimit }}
          exposeHttp: ${{ parameters.exposeHttp }}
          autoscaling: ${{ parameters.autoscaling }}

    - $yaml: ../_shared/step-publish-code.yaml

    - $yaml: ../_shared/step-publish-gitops.yaml

    - $yaml: ../_shared/step-register.yaml

  output:
    $yaml: ../_shared/output-gitops.yaml
