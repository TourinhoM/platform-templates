apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: service-day2
  title: Edit Service (day-2)
  description: Muda o size ou adiciona uma capability (database/cache) a um serviço existente — abre PR com a mudança no service definition.
  tags:
    - day-2
    - service
spec:
  owner: group:default/platform-engineering
  type: service

  parameters:
    - title: O que mudar
      required: [component]
      properties:
        component:
          title: Serviço
          type: string
          description: Qual serviço editar (precisa já ter service.yaml)
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Component
            defaultKind: Component
            allowArbitraryValues: false
        size:
          title: Novo size
          type: string
          description: Vazio = não mexe no size.
          enum: ['', small, medium, large]
          enumNames:
            - '(manter atual)'
            - 'small · pod até 200m CPU / 256Mi · namespace 1 CPU / 1Gi'
            - 'medium · pod até 1 CPU / 512Mi · namespace 4 CPU / 4Gi'
            - 'large · pod até 2 CPU / 1Gi · namespace 8 CPU / 8Gi'
          default: ''
        capability:
          title: Adicionar capability
          type: string
          description: Provisiona infra com lifecycle próprio (Secret de conexão no namespace da app). Vazio = não adiciona.
          enum: ['', database, cache]
          enumNames:
            - '(nenhuma)'
            - 'database · PostgreSQL + Secret de conexão'
            - 'cache · Redis + Secret de conexão'
          default: ''

  # O scaffolder só ORQUESTRA: dispara o workflow day-2 do próprio repo, que
  # faz a edição (yq) e abre o PR. Cirurgia de arquivo mora no CI — sem
  # módulos de fs no Backstage, sem rebuild, lógica versionada na plataforma.
  steps:
    - id: dispatch
      name: Disparar edição via CI do serviço
      action: github:actions:dispatch
      input:
        repoUrl: github.com?owner=tourinho-labs&repo=${{ (parameters.component | parseEntityRef).name }}
        workflowId: service-day2.yml
        branchOrTagName: main
        workflowInputs:
          size: ${{ parameters.size }}
          add-capability: ${{ parameters.capability }}

  output:
    links:
      - title: Acompanhar a edição (Actions)
        url: https://github.com/tourinho-labs/${{ (parameters.component | parseEntityRef).name }}/actions/workflows/service-day2.yml
      - title: PR vai aparecer aqui
        url: https://github.com/tourinho-labs/${{ (parameters.component | parseEntityRef).name }}/pulls
